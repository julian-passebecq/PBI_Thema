name: Materialize Theme Forge source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild original source
        shell: bash
        run: |
          set -euo pipefail
          {
            for n in 00 01 02 03 04 05 06; do cat ".bootstrap/theme/part${n}.b64"; done
            cat .bootstrap/fix07a.b64 .bootstrap/fix07b.b64
            for n in 08 09 10 11 12 13 14; do cat ".bootstrap/theme/part${n}.b64"; done
          } | base64 --decode | gzip --decompress > theme-forge.html
          test "$(wc -c < theme-forge.html)" -gt 500000
          grep -q '<title>Power BI Theme Forge</title>' theme-forge.html
      - name: Apply standalone browser fixes
        run: python scripts/standalone_patch.py
      - name: Verify standalone markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'function browserSave' theme-forge.html
          grep -q 'Standalone mode' theme-forge.html
          grep -q 'name="viewport"' theme-forge.html
      - name: Commit materialized app and remove bootstrap payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add theme-forge.html
          git rm -r .bootstrap
          git rm .github/workflows/bootstrap-source.yml
          git commit -m 'Materialize Theme Forge 1.7 standalone app'
          git push
